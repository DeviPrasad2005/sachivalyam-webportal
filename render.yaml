services:
  - type: web
    name: gram-panchayat-portal
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_HOST
        fromService:
          type: pserv
          name: gram-db
          property: host
      - key: DB_USER
        fromSecret: db-user
      - key: DB_PASSWORD
        fromSecret: db-password
      - key: DB_NAME
        fromSecret: db-name
  - type: pserv
    name: gram-db
    env: docker
    image: mysql:8
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: gram_db
      - key: MYSQL_USER
        fromSecret: db-user
      - key: MYSQL_PASSWORD
        fromSecret: db-password
    disk:
      name: gram-db-disk
      mountPath: /var/lib/mysql
      sizeGB: 10
