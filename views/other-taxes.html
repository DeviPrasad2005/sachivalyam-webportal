<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Other Tax Payment - Gram Panchayat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --google-blue: #4285f4;
      --google-red: #ea4335;
      --google-yellow: #fbbc05;
      --google-green: #34a853;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --background: #ffffff;
      --surface: #f8f9fa;
      --border: #dadce0;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom right, #eff6ff, #f1f5f9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: var(--text-primary);
      line-height: 1.5;
    }
    .container {
      background: var(--background);
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      padding: 2rem;
      max-width: 42rem;
      width: 100%;
      border: 1px solid var(--border);
    }
    .header {
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--google-blue);
      margin-bottom: 0.5rem;
    }
    .header p {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    label {
      display: block;
      color: var(--text-primary);
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      transition: border-color 0.3s, box-shadow 0.3s;
      font-size: 1rem;
      background-color: var(--background);
      color: var(--text-primary);
    }
    input:focus, select:focus {
      border-color: var(--google-blue);
      outline: none;
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.2);
    }
    .submit-button {
      background-color: var(--google-blue);
      color: white;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }
    .submit-button:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }
    .info {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .info strong {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Other Tax Payment</h1>
      <p>Pay your professional, trade license, or vacant land tax easily</p>
    </div>

    <form action="/pay-other-tax" method="POST">
      <div>
        <label for="taxpayerName">Full Name</label>
        <input type="text" id="taxpayerName" name="taxpayerName" required placeholder="Enter your full name" />
      </div>

      <div>
        <label for="taxType">Tax Type</label>
        <select id="taxType" name="taxType" required>
          <option value="">-- Select Tax Type --</option>
          <option value="Professional Tax">Professional Tax</option>
          <option value="Vacant Land Tax">Vacant Land Tax</option>
          <option value="Trade License Fee">Trade License Fee</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div>
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" pattern="[6-9]{1}[0-9]{9}" required placeholder="10-digit mobile number" />
      </div>

      <div>
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" name="amount" min="1" required placeholder="Enter amount" />
      </div>

      <div>
        <label for="transactionId">UPI Transaction ID</label>
        <input type="text" id="transactionId" name="transactionId" required placeholder="e.g., AXIS123456" />
      </div>

      <div style="padding-top: 1rem; text-align: center;">
        <button type="submit" class="submit-button">🧾 Submit Payment</button>
      </div>
    </form>

    <div class="info">
      <p>💡 Make UPI payment via your app <strong>before</strong> submitting this form.</p>
    </div>
  </div>
</body>
</html>
