<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Tax Status - Gram Panchayat Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #dc2626;
      --primary-dark: #b91c1c;
      --primary-light: #ef4444;
      --accent: #f59e0b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --background: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--background);
      min-height: 100vh;
      color: var(--text-primary);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .admin-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 0.375rem 0.875rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header-container h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .back-link {
      color: white;
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 600;
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Main Content */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 3rem 2rem;
      flex: 1;
      width: 100%;
    }

    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .page-header p {
      color: var(--text-secondary);
      font-size: 1.0625rem;
    }

    /* Users List View */
    .users-list {
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
    }

    .users-table th {
      background: var(--surface);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 0.8125rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1rem 1.5rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .users-table td {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }

    .users-table tbody tr {
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .users-table tbody tr:hover {
      background: var(--background);
    }

    .user-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .user-email {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .tax-summary {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .tax-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-paid {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }

    .badge-unpaid {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    .badge-no-amount {
      background: rgba(107, 114, 128, 0.1);
      color: var(--text-muted);
    }

    /* User Detail View */
    .user-detail {
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      display: none;
    }

    .user-detail.show {
      display: block;
    }

    .detail-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 2rem;
    }

    .detail-user-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-user-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .detail-user-email {
      opacity: 0.9;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .detail-body {
      padding: 2rem;
    }

    .taxes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .tax-card {
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .tax-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .tax-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .tax-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .tax-status {
      padding: 0.375rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-paid {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }

    .status-unpaid {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    .status-no-amount {
      background: rgba(107, 114, 128, 0.1);
      color: var(--text-muted);
    }

    .tax-amount {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .tax-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Tax Amount Input */
    .tax-amount-input {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .tax-amount-input input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.875rem;
    }

    .tax-amount-input button {
      padding: 0.5rem 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .tax-amount-input button:hover {
      background: var(--primary-dark);
    }

    .tax-amount-input button:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }

    /* Empty States */
    .no-users, .no-data {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .no-users-icon, .no-data-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .no-users h3, .no-data h3 {
      font-size: 1.25rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    /* Loading */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-container {
      text-align: center;
      padding: 4rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      margin-top: auto;
      color: var(--text-muted);
      background: white;
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .taxes-grid {
        grid-template-columns: 1fr;
      }

      .users-table th, .users-table td {
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
      }

      main {
        padding: 2rem 1rem;
      }

      .header-container {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }

      .header-left {
        flex-direction: column;
        text-align: center;
      }

      .detail-user-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="header-left">
        <span class="admin-badge">Admin Panel</span>
        <h1>User Tax Status</h1>
      </div>
      <nav>
        <a href="/admin/dashboard" class="back-link">← Back to Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="page-header">
      <h1>User Tax Payment Status</h1>
      <p>View tax amounts and payment status for all users</p>
    </div>

    <!-- Users List View -->
    <div id="usersList" class="users-list">
      <table class="users-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Tax Summary</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr>
            <td colspan="2" class="loading-container">
              <div class="loading"></div>
              <p>Loading users...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- User Detail View -->
    <div id="userDetail" class="user-detail">
      <div class="detail-header">
        <div class="detail-user-info">
          <div>
            <div class="detail-user-name" id="detailUserName"></div>
            <div class="detail-user-email" id="detailUserEmail"></div>
          </div>
          <button class="back-btn" onclick="showUsersList()">← Back to Users</button>
        </div>
      </div>
      <div class="detail-body">
        <div class="taxes-grid" id="taxesGrid">
          <!-- Tax cards will be populated here -->
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Gram Panchayat Admin Portal. All rights reserved.</p>
  </footer>

  <script>
    let allUsers = [];

    async function loadUserTaxStatus() {
      try {
        const response = await fetch('/admin/user-tax-status');
        allUsers = await response.json();

        renderUsersList(allUsers);
      } catch (error) {
        console.error('Error loading user tax status:', error);
        document.getElementById('usersTableBody').innerHTML = `
          <tr>
            <td colspan="2" class="no-users">
              <div class="no-users-icon">⚠️</div>
              <h3>Error Loading Data</h3>
              <p>Unable to load user tax status. Please try again later.</p>
            </td>
          </tr>
        `;
      }
    }

    function renderUsersList(users) {
      const tbody = document.getElementById('usersTableBody');

      if (users.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="2" class="no-users">
              <div class="no-users-icon">👥</div>
              <h3>No Users Found</h3>
              <p>There are no registered users in the system yet.</p>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = users.map(user => {
        const taxSummary = user.taxes.map(tax => {
          let badgeClass = 'badge-no-amount';
          if (tax.status === 'paid') badgeClass = 'badge-paid';
          else if (tax.status === 'unpaid') badgeClass = 'badge-unpaid';

          return `<span class="tax-badge ${badgeClass}">${tax.type}: ${tax.statusText}</span>`;
        }).join('');

        return `
          <tr onclick="showUserDetail(${user.id})">
            <td>
              <div class="user-name">${user.name}</div>
              <div class="user-email">${user.email}</div>
            </td>
            <td>
              <div class="tax-summary">${taxSummary}</div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function showUserDetail(userId) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      // Update detail view
      document.getElementById('detailUserName').textContent = user.name;
      document.getElementById('detailUserEmail').textContent = user.email;

      const taxesGrid = document.getElementById('taxesGrid');
      taxesGrid.innerHTML = user.taxes.map(tax => `
        <div class="tax-card">
          <div class="tax-header">
            <div class="tax-title">${tax.type}</div>
            <div class="tax-status status-${tax.status}">${tax.statusText}</div>
          </div>
          <div class="tax-amount">₹${tax.amount}</div>
          <div class="tax-label">Amount Due</div>
          <div class="tax-amount-input">
            <input type="number" id="amount-${tax.type.toLowerCase().replace(' ', '-')}-${user.id}" placeholder="Set amount" min="0" step="0.01" value="${tax.amount > 0 ? tax.amount : ''}">
            <button onclick="updateTaxAmount(${user.id}, '${tax.type}', '${tax.tableName}')">Update</button>
          </div>
        </div>
      `).join('');

      // Show detail view, hide list
      document.getElementById('usersList').style.display = 'none';
      document.getElementById('userDetail').classList.add('show');
    }

    async function updateTaxAmount(userId, taxType, tableName) {
      const inputId = `amount-${taxType.toLowerCase().replace(' ', '-')}-${userId}`;
      const input = document.getElementById(inputId);
      const amount = parseFloat(input.value);

      if (isNaN(amount) || amount < 0) {
        alert('Please enter a valid amount');
        return;
      }

      const button = input.nextElementSibling;
      const originalText = button.textContent;
      button.textContent = 'Updating...';
      button.disabled = true;

      try {
        const response = await fetch(`/admin/user-taxes/${userId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            taxType: taxType,
            tableName: tableName,
            amount: amount
          })
        });

        if (response.ok) {
          alert('Tax amount updated successfully!');
          // Reload the data to reflect changes
          await loadUserTaxStatus();
          // Refresh the detail view
          showUserDetail(userId);
        } else {
          const error = await response.text();
          alert('Error updating tax amount: ' + error);
        }
      } catch (error) {
        console.error('Error updating tax amount:', error);
        alert('Error updating tax amount. Please try again.');
      } finally {
        button.textContent = originalText;
        button.disabled = false;
      }
    }

    function showUsersList() {
      document.getElementById('userDetail').classList.remove('show');
      document.getElementById('usersList').style.display = 'block';
    }

    // Load data when page loads
    window.addEventListener('DOMContentLoaded', loadUserTaxStatus);
  </script>
</body>
</html>
