<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electricity Bill Payment - Sachivalayam</title>
  <style>
    :root {
      --google-blue: #4285f4;
      --google-red: #ea4335;
      --google-yellow: #fbbc05;
      --google-green: #34a853;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --background: #ffffff;
      --surface: #f8f9fa;
      --border: #dadce0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: var(--surface);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    header {
      background-color: var(--background);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .header-container {
      max-width: 1200px;
      margin: auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-container h1 {
      font-size: 24px;
      font-weight: bold;
      color: var(--google-blue);
    }

    .header-container a {
      font-size: 14px;
      color: var(--text-secondary);
      text-decoration: none;
    }

    .header-container a:hover {
      color: var(--google-blue);
    }

    main {
      max-width: 768px;
      margin: auto;
      padding: 48px 24px;
    }

    .form-card {
      background-color: var(--background);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .form-card h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="number"],
    input[type="month"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--background);
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: var(--google-blue);
      box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.3);
    }

    .grid {
      display: grid;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .grid-2 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    button {
      width: 100%;
      background-color: var(--google-blue);
      color: white;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 16px 24px;
      margin-top: auto;
      color: var(--text-secondary);
      font-size: 14px;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
    }

    .required {
      color: var(--google-red);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <h1>⚡ Electricity Bill Payment</h1>
      <a href="/dashboard">← Back to Dashboard</a>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="form-card">
      <h2>Enter Details to Pay Your Bill</h2>

      <form action="/electricity-bill" method="POST">

        <div>
          <label for="consumerName">Consumer Name <span class="required">*</span></label>
          <input type="text" id="consumerName" name="consumerName" required>
        </div>

        <div class="grid grid-2">
          <div>
            <label for="meterNumber">Meter Number <span class="required">*</span></label>
            <input type="text" id="meterNumber" name="meterNumber" required>
          </div>

          <div>
            <label for="billingMonth">Billing Month <span class="required">*</span></label>
            <input type="month" id="billingMonth" name="billingMonth" required>
          </div>
        </div>

        <div class="grid grid-2">
          <div>
            <label for="unitsConsumed">Units Consumed <span class="required">*</span></label>
            <input type="number" id="unitsConsumed" name="unitsConsumed" min="1" required>
          </div>

          <div>
            <label for="amount">Amount (₹) <span class="required">*</span></label>
            <input type="number" id="amount" name="amount" step="0.01" required>
          </div>
        </div>

        <div>
          <label for="upiId">UPI ID / Mobile Number <span class="required">*</span></label>
          <input type="text" id="upiId" name="upiId" placeholder="e.g., user@upi / 9876543210" required>
        </div>

        <button type="submit">Pay Now via UPI</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      &copy; 2025 Sachivalayam - All rights reserved.
    </div>
  </footer>

</body>
</html>
