<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grama Sabha Announcements</title>
  <style>
    :root {
      --primary: #2563eb; /* blue */
      --primary-600: #1d4ed8;
      --accent: #34a853; /* green */
      --bg: #f8fafc;
      --surface: #ffffff;
      --muted: #64748b;
      --text: #0f172a;
      --border: #e2e8f0;
      --ring: rgba(37, 99, 235, 0.25);
      --shadow: 0 10px 25px rgba(2, 6, 23, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, Roboto, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f1f5f9 0%, #ffffff 100%);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 16px 20px; }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--primary); text-decoration: none; }
    .logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary-600)); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow); font-weight: 700; font-size: 1.25rem; }
    .back-link { text-decoration: none; color: #fff; background: var(--primary); padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); transition: all 0.2s ease; }
    .back-link:hover { background: var(--primary-600); transform: translateY(-1px); box-shadow: 0 10px 15px rgba(29, 78, 216, 0.25); }

    .hero { padding: 36px 20px 8px 20px; background: radial-gradient(1200px 400px at 10% -20%, rgba(37, 99, 235, 0.08), transparent); }
    .hero h1 { max-width: 1100px; margin: 0 auto; font-size: clamp(22px, 3.6vw, 32px); font-weight: 800; letter-spacing: 0.3px; }

    main { flex: 1; padding: 22px 20px 36px 20px; }
    .board { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; }

    .announcement { border: 1px solid var(--border); border-left: 6px solid var(--primary); background: var(--surface); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
    .announcement h3 { margin: 0 0 4px 0; font-size: 18px; color: var(--primary); }
    .announcement .meta { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .announcement p { margin: 0; font-size: 14px; color: var(--text); }

    .empty { text-align: center; color: var(--muted); padding: 12px 0; }

    footer { border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); text-align: center; padding: 18px 12px; font-size: 14px; }

    a:focus-visible, button:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container nav">
      <div class="brand" aria-label="Grama Sabha Announcements">
        <div class="logo" aria-hidden="true">GS</div>
        <span>Grama Sabha</span>
      </div>
      <nav>
        <a class="back-link" href="/dashboard" title="Back to Dashboard">Back</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1>Latest Announcements</h1>
  </section>

  <!-- Board -->
  <main>
    <div id="announcements-container" class="board" role="feed" aria-busy="true" aria-live="polite">
      <div class="empty">Loading announcements...</div>
    </div>
  </main>

  <footer>
    &copy; 2025 Grama Sachivalayam. All Rights Reserved.
  </footer>

  <script>
    async function loadAnnouncements() {
      const container = document.getElementById('announcements-container');
      try {
        const response = await fetch('/api/announcements');
        const announcements = await response.json();
        container.innerHTML = '';

        if (!announcements.length) {
          container.innerHTML = '<div class="empty">No announcements available at the moment.</div>';
          return;
        }

        announcements.forEach((announcement) => {
          const date = announcement.created_at ? new Date(announcement.created_at).toLocaleString() : '';
          const el = document.createElement('article');
          el.className = 'announcement';
          el.setAttribute('role', 'article');
          el.innerHTML = `
            <h3>${announcement.title}</h3>
            <div class="meta">Posted on: ${date}</div>
            <p>${announcement.message}</p>
          `;
          container.appendChild(el);
        });
      } catch (error) {
        container.innerHTML = '<div class="empty">Error loading announcements.</div>';
      } finally {
        container.setAttribute('aria-busy', 'false');
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>
