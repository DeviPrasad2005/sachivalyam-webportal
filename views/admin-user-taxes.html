<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage User Tax Amounts - Gram Panchayat Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --primary-light: #3b82f6;
      --accent: #10b981;
      --accent-dark: #059669;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --background: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--background);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 2rem;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .back-link {
      text-decoration: none;
      color: white;
      background: var(--primary);
      padding: 0.625rem 1.25rem;
      border-radius: 10px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .back-link:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    /* Main Content */
    main {
      flex: 1;
      padding: 2rem 0;
    }

    .form-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }

    .user-selector {
      margin-bottom: 2rem;
    }

    .field {
      margin-bottom: 1.5rem;
    }

    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .field input, .field select {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .tax-section {
      background: var(--background);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .tax-section h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 2rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--text-muted);
      color: white;
    }

    .btn-secondary:hover {
      background: var(--text-secondary);
    }

    .message {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .message.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: white;
    }

    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container">
      <nav class="nav">
        <a href="/admin/dashboard" class="brand">
          <div class="logo">GP</div>
          Gram Panchayat Portal
        </a>
        <a href="/admin/dashboard" class="back-link">← Back to Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div class="form-container">
      <div class="card">
        <h2>Manage User Tax Amounts</h2>
        <p class="sub">Set tax amounts for each user. Users will see these amounts when making payments.</p>

        <div id="message"></div>

        <div class="user-selector">
          <div class="field">
            <label for="userSelect">Select User</label>
            <select id="userSelect" required>
              <option value="">Choose a user...</option>
            </select>
          </div>
        </div>

        <form id="taxForm">
          <div class="tax-section">
            <h3>House Tax</h3>
            <div class="field">
              <label for="houseAmount">Amount (₹)</label>
              <input
                type="number"
                id="houseAmount"
                name="house"
                placeholder="0.00"
                min="0"
                step="0.01"
              />
            </div>
          </div>

          <div class="tax-section">
            <h3>Water Tax</h3>
            <div class="field">
              <label for="waterAmount">Amount (₹)</label>
              <input
                type="number"
                id="waterAmount"
                name="water"
                placeholder="0.00"
                min="0"
                step="0.01"
              />
            </div>
          </div>

          <div class="tax-section">
            <h3>Electricity Bill</h3>
            <div class="field">
              <label for="electricityAmount">Amount (₹)</label>
              <input
                type="number"
                id="electricityAmount"
                name="electricity"
                placeholder="0.00"
                min="0"
                step="0.01"
              />
            </div>
          </div>

          <div class="tax-section">
            <h3>Other Taxes</h3>
            <div id="otherTaxesContainer">
              <!-- Dynamic other tax fields will be added here -->
            </div>
            <button type="button" id="addOtherTax" class="btn btn-secondary">+ Add Other Tax</button>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <span id="submitText">Update Tax Amounts</span>
              <span id="loading" class="loading" style="display: none;"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2025 Gram Panchayat Portal. All rights reserved.
  </footer>

  <script>
    let currentUserId = null;
    let otherTaxIndex = 0;

    // Load users on page load
    document.addEventListener('DOMContentLoaded', function() {
      loadUsers();
    });

    // Load users list
    async function loadUsers() {
      try {
        const response = await fetch('/admin/users-list');
        const users = await response.json();

        const userSelect = document.getElementById('userSelect');
        users.forEach(user => {
          const option = document.createElement('option');
          option.value = user.id;
          option.textContent = `${user.name} (${user.email})`;
          userSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading users:', error);
        showMessage('loading users list', 'error');
      }
    }

    // Handle user selection
    document.getElementById('userSelect').addEventListener('change', function() {
      currentUserId = this.value;
      if (currentUserId) {
        loadUserTaxes(currentUserId);
      } else {
        clearForm();
      }
    });

    // Load user tax amounts
    async function loadUserTaxes(userId) {
      try {
        const response = await fetch(`/admin/user-taxes/${userId}`);
        const taxData = await response.json();

        document.getElementById('houseAmount').value = taxData.house || '';
        document.getElementById('waterAmount').value = taxData.water || '';
        document.getElementById('electricityAmount').value = taxData.electricity || '';

        // Clear existing other taxes
        document.getElementById('otherTaxesContainer').innerHTML = '';

        // Add existing other taxes
        if (taxData.other && taxData.other.length > 0) {
          taxData.other.forEach(tax => {
            addOtherTaxField(tax.tax_type, tax.amount);
          });
        }
      } catch (error) {
        console.error('Error loading user taxes:', error);
        showMessage('Error loading tax amounts', 'error');
      }
    }

    // Clear form
    function clearForm() {
      document.getElementById('taxForm').reset();
      document.getElementById('otherTaxesContainer').innerHTML = '';
      otherTaxIndex = 0;
    }

    // Add other tax field
    function addOtherTaxField(taxType = '', amount = '') {
      const container = document.getElementById('otherTaxesContainer');
      const div = document.createElement('div');
      div.className = 'grid-2';
      div.innerHTML = `
        <div class="field">
          <label>Tax Type</label>
          <input type="text" name="otherTaxType[]" placeholder="e.g., Wealth Tax" value="${taxType}" required>
        </div>
        <div class="field">
          <label>Amount (₹)</label>
          <input type="number" name="otherTaxAmount[]" placeholder="0.00" min="0" step="0.01" value="${amount}" required>
        </div>
      `;
      container.appendChild(div);
      otherTaxIndex++;
    }

    // Handle add other tax button
    document.getElementById('addOtherTax').addEventListener('click', function() {
      addOtherTaxField();
    });

    // Handle form submission
    document.getElementById('taxForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!currentUserId) {
        showMessage('Please select a user first', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const loading = document.getElementById('loading');

      submitBtn.disabled = true;
      submitText.textContent = 'Updating...';
      loading.style.display = 'inline-block';

      try {
        const formData = new FormData(this);
        const data = {
          house: parseFloat(formData.get('house')) || 0,
          water: parseFloat(formData.get('water')) || 0,
          electricity: parseFloat(formData.get('electricity')) || 0,
          other: []
        };

        // Collect other taxes
        const taxTypes = formData.getAll('otherTaxType[]');
        const taxAmounts = formData.getAll('otherTaxAmount[]');

        for (let i = 0; i < taxTypes.length; i++) {
          if (taxTypes[i] && taxAmounts[i]) {
            data.other.push({
              taxType: taxTypes[i],
              amount: parseFloat(taxAmounts[i]) || 0
            });
          }
        }

        const response = await fetch(`/admin/user-taxes/${currentUserId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          showMessage('Tax amounts updated successfully!', 'success');
        } else {
          showMessage(result.error || 'Error updating tax amounts', 'error');
        }
      } catch (error) {
        console.error('Error updating tax amounts:', error);
        showMessage('Error updating tax amounts', 'error');
      } finally {
        submitBtn.disabled = false;
        submitText.textContent = 'Update Tax Amounts';
        loading.style.display = 'none';
      }
    });

    // Show message
    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => {
        messageDiv.innerHTML = '';
      }, 5000);
    }
  </script>
</body>
</html>
